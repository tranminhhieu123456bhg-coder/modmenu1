name: Build iOS Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Theos & SDKs
      run: |
        brew install ldid
        export THEOS=~/theos
        rm -rf $THEOS
        git clone --recursive https://github.com/theos/theos.git $THEOS
        rm -rf $THEOS/sdks
        git clone https://github.com/theos/sdks.git $THEOS/sdks

    - name: Patch Makefiles (Bypass Errors)
      run: |
        touch x2nios.h
        find . -name "Makefile" -exec sed -i '' 's/-Werror//g' {} +
        find . -name "*.mk" -exec sed -i '' 's/-Werror//g' {} +

    - name: Build Dylib
      run: |
        export THEOS=~/theos
        export PATH="$THEOS/bin:$PATH"
        export IGNORE_WARNINGS=1
        
        export ADDITIONAL_CFLAGS="-w -Wno-module-import-in-extern-c"
        export ADDITIONAL_OBJCFLAGS="-w -Wno-module-import-in-extern-c"
        export ADDITIONAL_CCFLAGS="-w -std=c++11 -Wno-module-import-in-extern-c"
        
        make clean || true
        make all messages=yes

    - name: Collect Dylib Files
      run: |
        mkdir -p output_dylibs
        find . -name "*.dylib" -exec cp {} output_dylibs/ \;
        ls -la output_dylibs/

    - name: Upload Dylib Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ModMenu-Dylib
        path: output_dylibs/*.dylib
